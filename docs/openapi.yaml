                        const: true
                    required:
                    - ok
                    additionalProperties: false
                required:
                - result
        default:
          description: Error (HttpsError con details.code de AppErrorCode)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
