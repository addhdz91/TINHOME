# Generado a partir de docs/05_API_CONTRACT.md. Mantener sincronizado con @tinhome/shared/schemas.
openapi: 3.1.0
info:
  title: TinHome API (Cloud Functions callables)
  version: 2.0.0
  description: 'Contrato de las funciones de TinHome Fase 1. Las callables se invocan con el SDK de Firebase (httpsCallable),
    que envía POST {data} y recibe {result}. Fuente de verdad en código: esquemas zod de @tinhome/shared.'
servers:
- url: https://europe-southwest1-{projectId}.cloudfunctions.net
  variables:
    projectId:
      default: tinhome-staging
- url: http://127.0.0.1:5001/demo-tinhome/europe-southwest1
  description: Emulador local
tags:
- name: Cuenta
- name: Casa
- name: Verificación
- name: Ciudades
- name: Descubrir
- name: Match
- name: Contacto
- name: Intercambios
- name: Valoraciones
- name: Premium
- name: Crecimiento
- name: Seguridad
- name: Notificaciones
- name: Patrocinados
- name: Analítica
- name: Privacidad
- name: Admin
- name: Chat
- name: Ayuda
- name: Webhooks
paths:
  /completeSignup:
    post:
      operationId: completeSignup
      tags:
      - Cuenta
      summary: Completa el alta tras crear el usuario en Auth
      description: 'Callable de Firebase. Guardas: A. Ver 05_API_CONTRACT.md.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                data:
                  type: object
                  additionalProperties: false
                  properties:
                    firstName: &id001
                      type: string
                    lastName: *id001
                    birthDate: &id006
                      type: string
                      format: date
                    referralCode: *id001
                    acceptedTerms: *id001
                    acceptedPrivacy: *id001
                  required:
                  - firstName
                  - lastName
                  - birthDate
                  - acceptedTerms
                  - acceptedPrivacy
              required:
              - data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  result:
                    type: object
                    additionalProperties: false
                    properties:
                      me:
                        $ref: '#/components/schemas/Me'
                    required:
                    - me
                required:
                - result
        default:
          description: Error (HttpsError con details.code de AppErrorCode)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - FirebaseIdToken: []
        AppCheck: []
  /getMe:
    post:
      operationId: getMe
      tags:
      - Cuenta
      summary: Estado agregado del usuario
      description: 'Callable de Firebase. Guardas: A. Ver 05_API_CONTRACT.md.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                data: &id002
                  type: object
                  additionalProperties: false
                  properties: {}
              required:
              - data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  result:
                    $ref: '#/components/schemas/Me'
                required:
                - result
        default:
          description: Error (HttpsError con details.code de AppErrorCode)
          content:
            application/json:
              schema:
