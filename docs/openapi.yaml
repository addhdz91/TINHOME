openapi: 3.1.0
info:
  title: TinHome API (Cloud Functions callables)
  version: 2.0.0
  description: 'Contrato de las funciones de TinHome Fase 1. Las callables se invocan con el SDK de Firebase (httpsCallable), que envía POST {data} y recibe {result}. Fuente de verdad en código: esquemas zod de @tinhome/shared.'
servers:
- url: https://europe-southwest1-{projectId}.cloudfunctions.net
  variables:
    projectId:
      default: tinhome-staging
- url: http://127.0.0.1:5001/demo-tinhome/europe-southwest1
  description: Emulador local
tags:
- name: Cuenta
- name: Casa
- name: Verificación
- name: Ciudades
- name: Descubrir
- name: Match
- name: Contacto
- name: Intercambios
- name: Valoraciones
- name: Premium
- name: Crecimiento
- name: Seguridad
- name: Notificaciones
- name: Patrocinados
- name: Analítica
- name: Privacidad
- name: Admin
- name: Chat
- name: Ayuda
- name: Webhooks
paths:
  /completeSignup:
    post:
      operationId: completeSignup
      tags:
      - Cuenta
      summary: Completa el alta tras crear el usuario en Auth
      description: 'Callable de Firebase. Guardas: A. Guarda la prueba de aceptación de términos, privacidad y cookies (legalAcceptances, 04 §2.21). Ver 05_API_CONTRACT.md.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                data:
                  type: object
                  properties:
                    firstName:
                      type: string
                      minLength: 1
                      maxLength: 60
                    lastName:
                      type: string
                      minLength: 1
                      maxLength: 60
                    birthDate:
                      type: string
                    referralCode:
                      type: string
                      maxLength: 20
                    acceptedTerms:
                      type: string
                      minLength: 1
                      maxLength: 40
                    acceptedPrivacy:
                      type: string
                      minLength: 1
                      maxLength: 40
                    acceptedCookies:
                      type: string
                      minLength: 1
                      maxLength: 40
                  required:
                  - firstName
                  - lastName
                  - birthDate
                  - acceptedTerms
                  - acceptedPrivacy
                  - acceptedCookies
              required:
              - data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  result:
                    type: object
                    properties:
                      me:
                        type: object
                        properties:
                          uid:
                            type: string
                          email:
                            type: string
                          firstName:
                            type: string
                          status:
                            type: string
                            enum:
                            - ACTIVE
                            - SUSPENDED
                            - BANNED
                            - DELETION_PENDING
                            - DELETED
                          verification:
                            type: object
                            properties:
                              emailVerified:
                                type: boolean
                              phoneVerified:
                                type: boolean
                              identity:
                                type: string
                                enum:
                                - NONE
                                - PENDING
                                - INFO_REQUESTED
                                - APPROVED
                                - REJECTED
                            required:
                            - emailVerified
                            - phoneVerified
                            - identity
                            additionalProperties: false
                          onboarding:
                            type: object
                            properties:
                              step:
                                anyOf:
                                - type: number
                                  const: 1
                                - type: number
                                  const: 2
                                - type: number
                                  const: 3
                                - type: number
                                  const: 4
                                - type: number
                                  const: 5
                                - type: number
                                  const: 6
                              completed:
                                type: boolean
                              percent:
                                type: integer
                                minimum: 0
                                maximum: 100
                            required:
                            - step
                            - completed
                            - percent
                            additionalProperties: false
                          home:
                            anyOf:
                            - type: object
                              properties:
                                id:
                                  type: string
                                status:
                                  type: string
                                  enum:
                                  - DRAFT
                                  - PUBLISHED
                                  - PAUSED
                                  - HIDDEN_BY_ADMIN
                                visible:
                                  type: boolean
                                cityId:
                                  type:
                                  - string
                                  - 'null'
                              required:
                              - id
                              - status
                              - visible
                              - cityId
                              additionalProperties: false
                            - type: 'null'
                          city:
                            anyOf:
                            - type: object
                              properties:
                                id:
                                  type: string
                                name:
                                  type: string
                                status:
                                  type: string
                                  enum:
                                  - WAITLIST
                                  - OPEN
                                  - CLOSED
                                progress:
                                  type: object
                                  properties:
                                    count:
                                      type: integer
                                      minimum: -9007199254740991
                                      maximum: 9007199254740991
                                    threshold:
                                      type: integer
                                      minimum: -9007199254740991
                                      maximum: 9007199254740991
                                  required:
                                  - count
                                  - threshold
                                  additionalProperties: false
                              required:
                              - id
                              - name
                              - status
                              - progress
                              additionalProperties: false
                            - type: 'null'
                          premium:
                            type: object
                            properties:
                              active:
                                type: boolean
                              until:
                                anyOf:
                                - type: string
                                  format: date-time
                                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                                - type: 'null'
                              source:
                                anyOf:
                                - type: string
                                  enum:
                                  - STRIPE
                                  - FOUNDER
                                  - REFERRAL
                                  - ADMIN
                                - type: 'null'
                              plan:
                                anyOf:
                                - type: string
                                  enum:
                                  - MONTHLY
                                  - YEARLY
                                - type: 'null'
                              cancelAtPeriodEnd:
                                type: boolean
                              canWithdraw:
                                type: boolean
                            required:
                            - active
                            - until
                            - source
                            - plan
                            - cancelAtPeriodEnd
                            - canWithdraw
                            additionalProperties: false
                          likes:
                            type: object
                            properties:
                              remainingToday:
                                anyOf:
                                - type: integer
                                  minimum: -9007199254740991
                                  maximum: 9007199254740991
                                - type: 'null'
                              resetsAt:
                                type: string
                                format: date-time
                                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                            required:
                            - remainingToday
                            - resetsAt
                            additionalProperties: false
                          canLike:
                            type: boolean
                          blockers:
                            type: array
                            items:
                              type: string
                              enum:
                              - ACCOUNT_RESTRICTED
                              - EMAIL
                              - PHONE
                              - HOME_INCOMPLETE
                              - NO_AVAILABILITY
                              - IDENTITY_MISSING
                              - IDENTITY_PENDING
                              - IDENTITY_REJECTED
                              - DECLARATION
                              - HOME_NOT_PUBLISHED
                              - CITY_WAITLIST
                              - LEGAL_OUTDATED
                          legalPending:
                            type: array
                            items:
                              type: object
                              properties:
                                slug:
                                  type: string
                                version:
                                  type: string
                                requiresReacceptance:
                                  type: boolean
                              required:
                              - slug
                              - version
                              - requiresReacceptance
                              additionalProperties: false
                          foundingMember:
                            type: boolean
                          referralCode:
                            type: string
                          roles:
                            type: array
                            items:
                              type: string
                              enum:
                              - admin
                              - superadmin
                          settings:
                            type: object
                            properties:
                              theme:
                                type: string
                                enum:
                                - system
                                - light
                                - dark
                                - black
                              notifications:
                                type: object
                                properties:
                                  MATCHES:
                                    type: object
                                    properties:
                                      email:
                                        type: boolean
                                      push:
                                        type: boolean
                                    additionalProperties: false
                                  MESSAGES:
                                    type: object
                                    properties:
                                      email:
                                        type: boolean
                                      push:
                                        type: boolean
                                    additionalProperties: false
                                  LIKES:
                                    type: object
                                    properties:
                                      email:
                                        type: boolean
                                      push:
                                        type: boolean
                                    additionalProperties: false
                                  EXCHANGES:
                                    type: object
                                    properties:
                                      email:
                                        type: boolean
                                      push:
                                        type: boolean
                                    additionalProperties: false
                                  REVIEWS:
                                    type: object
                                    properties:
                                      email:
                                        type: boolean
                                      push:
                                        type: boolean
                                    additionalProperties: false
                                additionalProperties: false
                              pushPreview:
                                type: boolean
                            required:
                            - theme
                            - notifications
                            - pushPreview
                            additionalProperties: false
                        required:
                        - uid
                        - email
                        - firstName
                        - status
                        - verification
                        - onboarding
                        - home
                        - city
                        - premium
                        - likes
                        - canLike
                        - blockers
                        - legalPending
                        - foundingMember
                        - referralCode
                        - roles
                        - settings
                        additionalProperties: false
                    required:
                    - me
                    additionalProperties: false
                required:
                - result
        default:
          description: Error (HttpsError con details.code de AppErrorCode)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - FirebaseIdToken: []
        AppCheck: []
  /getMe:
    post:
      operationId: getMe
      tags:
      - Cuenta
      summary: Estado agregado del usuario
      description: 'Callable de Firebase. Guardas: A. Ver 05_API_CONTRACT.md.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                data:
                  type: object
                  additionalProperties: false
                  properties: {}
              required:
              - data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  result:
                    $ref: '#/components/schemas/Me'
                required:
                - result
        default:
          description: Error (HttpsError con details.code de AppErrorCode)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - FirebaseIdToken: []
        AppCheck: []
  /updateProfile:
    post:
      operationId: updateProfile
      tags:
      - Cuenta
      summary: Actualiza el perfil público
      description: 'Callable de Firebase. Guardas: A,EV. Ver 05_API_CONTRACT.md.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                data:
                  type: object
                  additionalProperties: false
                  properties:
                    displayFirstName:
                      type: string
                    about:
                      type: string
                      maxLength: 300
                    languages:
                      type: array
                      items:
                        type: string
                    travelsWith:
                      type: string
                      enum:
                      - SOLO
                      - COUPLE
                      - FAMILY
                      - FRIENDS
                    avatarPath:
                      type: string
              required:
              - data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  result:
                    type: object
                    additionalProperties: false
                    properties:
                      profile:
                        $ref: '#/components/schemas/PublicProfile'
                    required:
                    - profile
                required:
                - result
        default:
          description: Error (HttpsError con details.code de AppErrorCode)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - FirebaseIdToken: []
        AppCheck: []
  /updateSettings:
    post:
      operationId: updateSettings
      tags:
      - Cuenta
      summary: Tema, preferencias de avisos y vista previa de push
      description: 'Callable de Firebase. Guardas: A. SERVICE y LEGAL no se aceptan (no se pueden desactivar). Una clave por categoría y canal. Ver 05_API_CONTRACT.md.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                data:
                  type: object
                  properties:
                    theme:
                      type: string
                      enum:
                      - system
                      - light
                      - dark
                      - black
                    notifications:
                      type: object
                      properties:
                        MATCHES:
                          type: object
                          properties:
                            email:
                              type: boolean
                            push:
                              type: boolean
                          additionalProperties: false
                        MESSAGES:
                          type: object
                          properties:
                            email:
                              type: boolean
                            push:
                              type: boolean
                          additionalProperties: false
                        LIKES:
                          type: object
                          properties:
                            email:
                              type: boolean
                            push:
                              type: boolean
                          additionalProperties: false
                        EXCHANGES:
                          type: object
                          properties:
                            email:
                              type: boolean
                            push:
                              type: boolean
                          additionalProperties: false
                        REVIEWS:
                          type: object
                          properties:
                            email:
                              type: boolean
                            push:
                              type: boolean
                          additionalProperties: false
                      additionalProperties: false
                    pushPreview:
                      type: boolean
                    marketingOptIn:
                      type: boolean
                  additionalProperties: false
              required:
              - data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  result:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        const: true
                    required:
                    - ok
                    additionalProperties: false
                required:
                - result
        default:
          description: Error (HttpsError con details.code de AppErrorCode)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - FirebaseIdToken: []
        AppCheck: []
  /confirmPhoneLinked:
    post:
      operationId: confirmPhoneLinked
      tags:
      - Cuenta
      summary: Confirma el teléfono vinculado en Auth
      description: 'Callable de Firebase. Guardas: A,EV. Ver 05_API_CONTRACT.md.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                data:
                  type: object
                  additionalProperties: false
                  properties: {}
              required:
              - data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  result:
                    type: object
                    additionalProperties: false
                    properties:
                      phoneVerified:
                        const: true
                    required:
                    - phoneVerified
                required:
                - result
        default:
          description: Error (HttpsError con details.code de AppErrorCode)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - FirebaseIdToken: []
        AppCheck: []
  /acceptLegalDocs:
    post:
      operationId: acceptLegalDocs
      tags:
      - Cuenta
      summary: Acepta versiones de textos legales
      description: 'Callable de Firebase. Guardas: A. Un registro de prueba por texto (source REACCEPTANCE). Ver 05_API_CONTRACT.md.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                data:
                  type: object
                  properties:
                    items:
                      minItems: 1
                      maxItems: 10
                      type: array
                      items:
                        type: object
                        properties:
                          slug:
                            type: string
                            minLength: 1
                            maxLength: 60
                          version:
                            type: string
                            minLength: 1
                            maxLength: 40
                        required:
                        - slug
                        - version
                  required:
                  - items
              required:
              - data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  result:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        const: true
                    required:
                    - ok
                    additionalProperties: false
                required:
                - result
        default:
          description: Error (HttpsError con details.code de AppErrorCode)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - FirebaseIdToken: []
        AppCheck: []
  /requestAccountDeletion:
    post:
      operationId: requestAccountDeletion
      tags:
      - Cuenta
      summary: Solicita la baja (BR-29)
      description: 'Callable de Firebase. Guardas: A (reautenticado < 5 min). DELETION_PENDING, casa en pausa, intercambios abiertos cancelados, Stripe sin renovación, sesiones revocadas, N-18. Idempotente. J-05 purga a los P-16 días. Ver 05_API_CONTRACT.md.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                data:
                  type: object
                  properties:
                    confirm:
                      type: string
                      const: ELIMINAR
                  required:
                  - confirm
              required:
              - data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  result:
                    type: object
                    properties:
                      purgeAt:
                        type: string
                    required:
                    - purgeAt
                    additionalProperties: false
                required:
                - result
        default:
          description: Error (HttpsError con details.code de AppErrorCode)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - FirebaseIdToken: []
        AppCheck: []
  /upsertHome:
    post:
      operationId: upsertHome
      tags:
      - Casa
      summary: Crea o actualiza la casa del usuario
      description: 'Callable de Firebase. Guardas: A,EV,ACT. Acepta borradores (AC-06.1): solo `cityId` es obligatorio; la completitud para publicar la comprueba BR-03. Ver 05_API_CONTRACT.md.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                data:
                  $ref: '#/components/schemas/HomeInput'
              required:
              - data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  result:
                    type: object
                    additionalProperties: false
                    properties:
                      home:
                        $ref: '#/components/schemas/HomeOwnerView'
                    required:
                    - home
                required:
                - result
        default:
          description: Error (HttpsError con details.code de AppErrorCode)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - FirebaseIdToken: []
        AppCheck: []
  /reorderHomePhotos:
    post:
      operationId: reorderHomePhotos
      tags:
      - Casa
      summary: Reordena fotos
      description: 'Callable de Firebase. Guardas: A,EV. Ver 05_API_CONTRACT.md.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                data:
                  type: object
                  properties:
                    photoIds:
                      minItems: 1
                      maxItems: 20
                      type: array
                      items:
                        type: string
                        minLength: 1
                  required:
                  - photoIds
              required:
              - data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  result:
                    type: object
                    additionalProperties: false
                    properties:
                      photos:
                        type: array
                        items:
                          $ref: '#/components/schemas/Photo'
                    required:
                    - photos
                required:
                - result
        default:
          description: Error (HttpsError con details.code de AppErrorCode)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - FirebaseIdToken: []
        AppCheck: []
  /deleteHomePhoto:
    post:
      operationId: deleteHomePhoto
      tags:
      - Casa
      summary: Borra una foto
      description: 'Callable de Firebase. Guardas: A,EV. Ver 05_API_CONTRACT.md.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                data:
                  type: object
                  properties:
                    photoId:
                      type: string
                      pattern: ^[A-Za-z0-9_-]{1,256}$
                  required:
                  - photoId
              required:
              - data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  result:
                    type: object
                    additionalProperties: false
                    properties:
                      photos:
                        type: array
                        items:
                          $ref: '#/components/schemas/Photo'
                    required:
                    - photos
                required:
                - result
        default:
          description: Error (HttpsError con details.code de AppErrorCode)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - FirebaseIdToken: []
        AppCheck: []
  /acceptDeclaration:
    post:
      operationId: acceptDeclaration
      tags:
      - Casa
      summary: Acepta la declaración responsable
      description: 'Callable de Firebase. Guardas: A,EV. Ver 05_API_CONTRACT.md.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                data:
                  type: object
                  properties:
                    version:
                      type: string
                      minLength: 1
                      maxLength: 40
                  required:
                  - version
              required:
              - data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  result:
                    type: object
                    additionalProperties: false
                    properties:
                      home:
                        $ref: '#/components/schemas/HomeOwnerView'
                    required:
                    - home
                required:
                - result
        default:
          description: Error (HttpsError con details.code de AppErrorCode)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - FirebaseIdToken: []
        AppCheck: []
  /publishHome:
    post:
      operationId: publishHome
      tags:
      - Casa
      summary: Publica la casa
      description: 'Callable de Firebase. Guardas: A,EV,PV,ACT. Ver 05_API_CONTRACT.md.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                data:
                  type: object
                  additionalProperties: false
                  properties: {}
              required:
              - data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  result:
                    type: object
                    additionalProperties: false
                    properties:
                      home:
                        $ref: '#/components/schemas/HomeOwnerView'
                      visible:
                        type: boolean
                      pendingReasons:
                        type: array
                        description: Motivos BR-04 por los que aún no es visible.
                        items:
                          $ref: '#/components/schemas/VisibilityProblem'
                    required:
